<ngx-spinner
  name="API"
  bdColor="rgba(0,0,0,0.69)"
  size="medium"
  color="#284980"
  type="ball-atom"
  [fullScreen]="true"
  [zIndex]="999999999"
>
  <p style="color: white">Loading...</p>
</ngx-spinner>
<router-outlet></router-outlet>
@if (isVisible()) {
  <button type="button" class="scroll-to-top-btn" (click)="scrollToTop()">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
}
